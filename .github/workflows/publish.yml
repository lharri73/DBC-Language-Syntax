name: Publish to Marketplace

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish
        run: npx vsce publish -p ${{ secrets.MARKETPLACE_TOKEN }}
